[project]
name = "save-media-tg-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kurigram>=2.2.6",
    "TgCrypto>=1.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
